<!doctype html>
<!--
  PROTOTYPE -- throwaway, not production code. Answers wayfinder ticket #7
  ("Prototipar vista de Historial/Calendario", reabierto para aplicar la
  identidad visual de collectiveai.io: tipografias Olivetta/Leitura y
  paleta de marca real, extraida de https://collectiveai.io/).

  Mismas tres variantes de interaccion que la version anterior
  (heatmap/franja, lista-mini/modal, insignia/sidebar), reskineadas con
  la identidad de marca. Datos de ejemplo para septiembre 2026.
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Vista de Historial</title>
<style>
  @font-face {
    font-family: 'Olivetta';
    src: url('fonts/olivetta-regular.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Olivetta';
    src: url('fonts/olivetta-semi-bold.woff2') format('woff2');
    font-weight: 600; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Olivetta';
    src: url('fonts/olivetta-black.woff2') format('woff2');
    font-weight: 900; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Leitura';
    src: url('fonts/leitura-italic.woff2') format('woff2');
    font-weight: 400; font-style: italic; font-display: swap;
  }

  :root {
    color-scheme: light;
    /* collectiveai.io brand tokens (brandMain + surface/paper) */
    --ink: #1E1E1E;
    --ink-secondary: #4D4D4D;
    --ink-muted: #8C8C8C;
    --ink-on-accent: #FFFFFF;
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --surface-paper: #F5F5F5;
    --surface-overlay: #F7F7F7;
    --border: #E3E3E3;
    --border-strong: #C9C9C9;
    --accent: #8054FF;
    --accent-pressed: #5C3CB9;
    --accent-soft: #ECE6FF;
    --accent-soft-ink: #5C3CB9;
    --heat-0: var(--surface);
    --heat-1: #E4DBFF;
    --heat-2: #C2AFFF;
    --heat-3: #8054FF;
    --heat-4: #331561;
    --heat-1-ink: var(--ink);
    --heat-2-ink: #1E1E1E;
    --heat-3-ink: #FFFFFF;
    --heat-4-ink: #FFFFFF;
    --notice-bg: #FCEFD9;
    --notice-border: #E7C784;
    --notice-ink: #5C4713;
    --shadow: 0 12px 30px rgba(30, 20, 60, .14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ink: #DCD7E6;
      --ink-secondary: #A8A2B6;
      --ink-muted: #8C8598;
      --ink-on-accent: #16131C;
      --bg: #16131C;
      --surface: #1F1B28;
      --surface-paper: #0F0D13;
      --surface-overlay: #2B2635;
      --border: #3B3547;
      --border-strong: #6B6180;
      --accent: #A98CFF;
      --accent-pressed: #8054FF;
      --accent-soft: #362A4D;
      --accent-soft-ink: #DCC9FF;
      --heat-0: var(--surface);
      --heat-1: #2B2635;
      --heat-2: #4A3D6B;
      --heat-3: #8054FF;
      --heat-4: #A98CFF;
      --heat-1-ink: var(--ink-muted);
      --heat-2-ink: #EDE7F7;
      --heat-3-ink: #FFFFFF;
      --heat-4-ink: #16131C;
      --notice-bg: #362A15;
      --notice-border: #6B551C;
      --notice-ink: #F2D488;
      --shadow: 0 12px 30px rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ink: #DCD7E6;
    --ink-secondary: #A8A2B6;
    --ink-muted: #8C8598;
    --ink-on-accent: #16131C;
    --bg: #16131C;
    --surface: #1F1B28;
    --surface-paper: #0F0D13;
    --surface-overlay: #2B2635;
    --border: #3B3547;
    --border-strong: #6B6180;
    --accent: #A98CFF;
    --accent-pressed: #8054FF;
    --accent-soft: #362A4D;
    --accent-soft-ink: #DCC9FF;
    --heat-0: var(--surface);
    --heat-1: #2B2635;
    --heat-2: #4A3D6B;
    --heat-3: #8054FF;
    --heat-4: #A98CFF;
    --heat-1-ink: var(--ink-muted);
    --heat-2-ink: #EDE7F7;
    --heat-3-ink: #FFFFFF;
    --heat-4-ink: #16131C;
    --notice-bg: #362A15;
    --notice-border: #6B551C;
    --notice-ink: #F2D488;
    --shadow: 0 12px 30px rgba(0, 0, 0, .5);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 24px 104px;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Olivetta', system-ui, sans-serif;
  }
  .daynum, .count-corner, .badge, .task-meta, .modal-sub, .sidebar-sub, .mini-task {
    font-variant-numeric: tabular-nums;
  }

  .prototype-banner {
    max-width: 780px;
    margin: 0 auto 20px;
    padding: 10px 16px;
    background: var(--notice-bg);
    border: 1px solid var(--notice-border);
    border-radius: 8px;
    font-size: 13px;
    color: var(--notice-ink);
  }
  .app {
    max-width: 780px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px;
  }
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 18px;
  }
  .month-nav button {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    border-radius: 7px;
    width: 34px;
    height: 34px;
    font-size: 16px;
    cursor: pointer;
    font-family: 'Olivetta', sans-serif;
  }
  .month-nav button:hover { background: var(--surface-overlay); }
  .month-nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .month-nav h1 {
    font-family: 'Leitura', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 23px;
    margin: 0;
    min-width: 210px;
    text-align: center;
    text-wrap: balance;
    color: var(--ink);
  }
  .weekdays, .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 7px;
  }
  .weekdays {
    margin-bottom: 7px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--ink-muted);
    text-align: center;
  }
  .cell {
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface);
    cursor: default;
    position: relative;
    text-align: left;
  }
  .cell.empty { border: none; background: transparent; }
  .cell.today { box-shadow: inset 0 0 0 2px var(--ink); }
  .cell.selected { outline: 2px solid var(--accent); outline-offset: -2px; }
  .cell.has-activity { cursor: pointer; }
  .cell.has-activity:hover { border-color: var(--accent); }
  .daynum { font-size: 12px; color: var(--ink-muted); }

  /* ---------- Variant A: heatmap ---------- */
  [data-variant="A"] .cell { height: 58px; padding: 6px; }
  [data-variant="A"] .count-corner { position: absolute; bottom: 4px; right: 6px; font-size: 11px; font-weight: 900; }
  [data-variant="A"] .heat-0 { background: var(--heat-0); }
  [data-variant="A"] .heat-1 { background: var(--heat-1); color: var(--heat-1-ink); }
  [data-variant="A"] .heat-2 { background: var(--heat-2); color: var(--heat-2-ink); }
  [data-variant="A"] .heat-3 { background: var(--heat-3); color: var(--heat-3-ink); }
  [data-variant="A"] .heat-4 { background: var(--heat-4); color: var(--heat-4-ink); }
  [data-variant="A"] .heat-1 .daynum, [data-variant="A"] .heat-2 .daynum,
  [data-variant="A"] .heat-3 .daynum, [data-variant="A"] .heat-4 .daynum { color: inherit; opacity: .82; }
  .legend { display: flex; align-items: center; gap: 6px; justify-content: flex-end; margin-top: 12px; font-size: 11.5px; color: var(--ink-muted); }
  .legend .swatch { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--border); }
  .detail-strip { margin-top: 16px; border-top: 1px dashed var(--border); padding-top: 14px; min-height: 40px; }
  .detail-strip .placeholder { color: var(--ink-muted); font-size: 13.5px; }
  .detail-strip h2 { font-size: 14.5px; margin: 0 0 9px; font-weight: 700; }
  .detail-row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .task-meta { color: var(--ink-muted); font-size: 12.5px; white-space: nowrap; }

  /* ---------- Variant B: mini task list + modal ---------- */
  [data-variant="B"] .cell { height: 92px; padding: 6px; overflow: hidden; }
  [data-variant="B"] .mini-task {
    font-size: 10px; background: var(--accent-soft); color: var(--accent-soft-ink);
    border-radius: 5px; padding: 1px 5px; margin-top: 3px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  [data-variant="B"] .mini-more { font-size: 10.5px; color: var(--ink-muted); margin-top: 3px; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(22, 19, 28, .45); display: none; align-items: center; justify-content: center; z-index: 20; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--surface); border-radius: 12px; border: 1px solid var(--border); padding: 22px; width: 340px; max-width: 90vw; box-shadow: var(--shadow); }
  .modal h2 { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
  .modal .modal-sub { color: var(--ink-muted); font-size: 12px; margin-bottom: 14px; }
  .modal .close-btn { float: right; border: none; background: none; font-size: 17px; cursor: pointer; color: var(--ink-muted); font-family: 'Olivetta', sans-serif; }
  .modal .close-btn:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }

  /* ---------- Variant C: badge + docked sidebar ---------- */
  .layout-c { display: flex; gap: 22px; align-items: flex-start; }
  .layout-c .calendar-col { flex: 1 1 auto; min-width: 0; }
  [data-variant="C"] .cell { height: 44px; padding: 5px; }
  [data-variant="C"] .badge {
    position: absolute; top: 4px; right: 5px; min-width: 16px; height: 16px; border-radius: 8px;
    background: var(--accent); color: var(--ink-on-accent); font-size: 10px; font-weight: 900;
    display: flex; align-items: center; justify-content: center; padding: 0 4px;
  }
  .sidebar { flex: 0 0 208px; border: 1px solid var(--border); border-radius: 10px; padding: 14px; background: var(--surface-paper); min-height: 270px; }
  .sidebar h2 { font-size: 14px; margin: 0 0 2px; font-weight: 700; }
  .sidebar .sidebar-sub { color: var(--ink-muted); font-size: 11.5px; margin-bottom: 12px; }
  .sidebar .detail-row { font-size: 12.5px; }

  /* ---------- switcher bar (prototype tooling, not part of the design) ---------- */
  .switcher {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    background: var(--ink); color: var(--bg);
    padding: 9px 11px; border-radius: 999px; box-shadow: var(--shadow);
    font-size: 13px; z-index: 30;
  }
  .switcher button {
    border: none; background: rgba(255, 255, 255, .16); color: inherit;
    width: 27px; height: 27px; border-radius: 50%; cursor: pointer; font-size: 14px;
    font-family: 'Olivetta', sans-serif;
  }
  .switcher button:hover { background: rgba(255, 255, 255, .28); }
  .switcher button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .switcher .label { min-width: 195px; text-align: center; }
  .switcher .label small { display: block; opacity: .65; font-size: 10.5px; }
</style>
</head>
<body>


<div class="prototype-banner">
  Prototipo — ticket <strong>#7</strong> (reabierto). Identidad visual de <strong>collectiveai.io</strong> aplicada: tipografías Olivetta/Leitura y paleta de marca (real, extraída del sitio). Datos de ejemplo (no reales).
</div>

<div class="app" id="app">
  <!-- rendered by JS -->
</div>

<div class="switcher">
  <button id="prevVariant" aria-label="Variante anterior">‹</button>
  <div class="label" id="variantLabel"></div>
  <button id="nextVariant" aria-label="Variante siguiente">›</button>
</div>

<script>
// ---- sample data: September 2026, keyed by day-of-month ----
const YEAR = 2026, MONTH = 8; // JS months are 0-indexed: 8 = September
const TODAY_DAY = 9;

const SAMPLE = {
  2:  [ { name: "Escribir informe trimestral", pomodoros: 3, minutes: 75 } ],
  3:  [ { name: "Escribir informe trimestral", pomodoros: 1, minutes: 25 },
        { name: "Revisar PRs pendientes", pomodoros: 2, minutes: 50 } ],
  4:  [ { name: "Revisar PRs pendientes", pomodoros: 1, minutes: 18 } ],
  7:  [ { name: "Preparar presentación cliente", pomodoros: 4, minutes: 100 },
        { name: "Estudiar Rust", pomodoros: 1, minutes: 25 } ],
  8:  [ { name: "Preparar presentación cliente", pomodoros: 2, minutes: 50 },
        { name: "Revisar PRs pendientes", pomodoros: 1, minutes: 12 },
        { name: "Planificar sprint", pomodoros: 1, minutes: 25 } ],
  9:  [ { name: "Planificar sprint", pomodoros: 2, minutes: 50 },
        { name: "Estudiar Rust", pomodoros: 2, minutes: 47 } ],
  11: [ { name: "Escribir informe trimestral", pomodoros: 1, minutes: 25 } ],
  14: [ { name: "Preparar presentación cliente", pomodoros: 5, minutes: 125 },
        { name: "Revisar PRs pendientes", pomodoros: 1, minutes: 25 },
        { name: "Planificar sprint", pomodoros: 1, minutes: 8 } ],
  15: [ { name: "Preparar presentación cliente", pomodoros: 1, minutes: 25 } ],
  18: [ { name: "Estudiar Rust", pomodoros: 3, minutes: 68 } ],
  21: [ { name: "Revisar PRs pendientes", pomodoros: 2, minutes: 50 },
        { name: "Planificar sprint", pomodoros: 2, minutes: 45 } ],
  22: [ { name: "Planificar sprint", pomodoros: 1, minutes: 25 } ],
  25: [ { name: "Escribir informe trimestral", pomodoros: 2, minutes: 50 },
        { name: "Estudiar Rust", pomodoros: 1, minutes: 25 },
        { name: "Revisar PRs pendientes", pomodoros: 1, minutes: 25 } ],
  28: [ { name: "Preparar presentación cliente", pomodoros: 1, minutes: 20 } ],
  29: [ { name: "Planificar sprint", pomodoros: 3, minutes: 70 } ],
};

function totalPomodoros(dayTasks) { return dayTasks.reduce((s, t) => s + t.pomodoros, 0); }
function heatBucket(count) {
  if (count === 0) return 0;
  if (count <= 2) return 1;
  if (count <= 4) return 2;
  if (count <= 6) return 3;
  return 4;
}
function fmtMinutes(m) {
  const h = Math.floor(m / 60), r = m % 60;
  return h ? `${h}h ${r}m` : `${r}m`;
}

const WEEKDAYS = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const MONTH_NAMES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio",
  "Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

function buildDayCells() {
  const firstOfMonth = new Date(YEAR, MONTH, 1);
  const leadingBlanks = (firstOfMonth.getDay() + 6) % 7;
  const daysInMonth = new Date(YEAR, MONTH + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < leadingBlanks; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  return cells;
}

let selectedDay = TODAY_DAY;
let variant = new URLSearchParams(location.search).get("variant") || "A";
const VARIANTS = [
  { key: "A", name: "Heatmap + franja de detalle" },
  { key: "B", name: "Lista mini en celda + modal" },
  { key: "C", name: "Insignia + panel lateral fijo" },
];

function render() {
  document.body.dataset.variant = variant;
  const app = document.getElementById("app");
  const cells = buildDayCells();

  const header = `
    <div class="month-nav">
      <button id="prevMonth" aria-label="Mes anterior">‹</button>
      <h1>${MONTH_NAMES[MONTH]} ${YEAR}</h1>
      <button id="nextMonth" aria-label="Mes siguiente">›</button>
    </div>
    <div class="weekdays">${WEEKDAYS.map(w => `<div>${w}</div>`).join("")}</div>
  `;

  let bodyHtml = "";
  if (variant === "A") bodyHtml = renderVariantA(cells);
  else if (variant === "B") bodyHtml = renderVariantB(cells);
  else bodyHtml = renderVariantC(cells);

  app.innerHTML = header + bodyHtml;
  wireCellClicks();
  if (variant === "B") wireModal();

  const labelEl = document.getElementById("variantLabel");
  const v = VARIANTS.find(v => v.key === variant);
  labelEl.innerHTML = `${v.key} <small>${v.name}</small>`;
}

function renderVariantA(cells) {
  const gridHtml = cells.map(d => {
    if (d === null) return `<div class="cell empty"></div>`;
    const tasks = SAMPLE[d] || [];
    const count = totalPomodoros(tasks);
    const bucket = heatBucket(count);
    const classes = ["cell", `heat-${bucket}`];
    if (d === TODAY_DAY) classes.push("today");
    if (d === selectedDay) classes.push("selected");
    if (tasks.length) classes.push("has-activity");
    return `<div class="${classes.join(" ")}" data-day="${d}">
      <div class="daynum">${d}</div>
      ${count ? `<div class="count-corner">${count}</div>` : ""}
    </div>`;
  }).join("");

  const legend = `
    <div class="legend">
      <span>Menos</span>
      <span class="swatch" style="background:var(--heat-0)"></span>
      <span class="swatch" style="background:var(--heat-1)"></span>
      <span class="swatch" style="background:var(--heat-2)"></span>
      <span class="swatch" style="background:var(--heat-3)"></span>
      <span class="swatch" style="background:var(--heat-4)"></span>
      <span>Más</span>
    </div>`;

  return `<div class="grid">${gridHtml}</div>${legend}${renderDetailStrip()}`;
}

function renderDetailStrip() {
  const tasks = SAMPLE[selectedDay] || [];
  if (!tasks.length) {
    return `<div class="detail-strip"><div class="placeholder">Sin Pomodoros registrados ese día. Elegí un día con actividad.</div></div>`;
  }
  const total = totalPomodoros(tasks);
  const rows = tasks.map(t => `
    <div class="detail-row">
      <span class="task-name">${t.name}</span>
      <span class="task-meta">${t.pomodoros} Pomodoro${t.pomodoros !== 1 ? "s" : ""} · ${fmtMinutes(t.minutes)}</span>
    </div>`).join("");
  return `<div class="detail-strip">
    <h2>${selectedDay} de ${MONTH_NAMES[MONTH]} — ${total} Pomodoro${total !== 1 ? "s" : ""} en total</h2>
    ${rows}
  </div>`;
}

function renderVariantB(cells) {
  const MAX_VISIBLE = 2;
  const gridHtml = cells.map(d => {
    if (d === null) return `<div class="cell empty"></div>`;
    const tasks = SAMPLE[d] || [];
    const classes = ["cell"];
    if (d === TODAY_DAY) classes.push("today");
    if (tasks.length) classes.push("has-activity");
    const visible = tasks.slice(0, MAX_VISIBLE);
    const overflow = tasks.length - visible.length;
    return `<div class="${classes.join(" ")}" data-day="${d}">
      <div class="daynum">${d}</div>
      ${visible.map(t => `<div class="mini-task">${t.name} ×${t.pomodoros}</div>`).join("")}
      ${overflow > 0 ? `<div class="mini-more">+${overflow} más</div>` : ""}
    </div>`;
  }).join("");

  return `<div class="grid">${gridHtml}</div>
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal" id="modalContent"></div>
    </div>`;
}

function modalContentHtml(day) {
  const tasks = SAMPLE[day] || [];
  const total = totalPomodoros(tasks);
  const rows = tasks.map(t => `
    <div class="detail-row">
      <span class="task-name">${t.name}</span>
      <span class="task-meta">${t.pomodoros} Pomodoro${t.pomodoros !== 1 ? "s" : ""} · ${fmtMinutes(t.minutes)}</span>
    </div>`).join("") || `<div class="placeholder">Sin Pomodoros registrados.</div>`;
  return `
    <button class="close-btn" id="modalClose">×</button>
    <h2>${day} de ${MONTH_NAMES[MONTH]} de ${YEAR}</h2>
    <div class="modal-sub">${total} Pomodoro${total !== 1 ? "s" : ""} en total</div>
    ${rows}
  `;
}

function wireModal() {
  const backdrop = document.getElementById("modalBackdrop");
  document.getElementById("modalClose")?.addEventListener("click", () => backdrop.classList.remove("open"));
  backdrop?.addEventListener("click", (e) => { if (e.target === backdrop) backdrop.classList.remove("open"); });
}

function renderVariantC(cells) {
  const gridHtml = cells.map(d => {
    if (d === null) return `<div class="cell empty"></div>`;
    const tasks = SAMPLE[d] || [];
    const count = totalPomodoros(tasks);
    const classes = ["cell"];
    if (d === TODAY_DAY) classes.push("today");
    if (d === selectedDay) classes.push("selected");
    if (tasks.length) classes.push("has-activity");
    return `<div class="${classes.join(" ")}" data-day="${d}">
      <div class="daynum">${d}</div>
      ${count ? `<div class="badge">${count}</div>` : ""}
    </div>`;
  }).join("");

  const tasks = SAMPLE[selectedDay] || [];
  const total = totalPomodoros(tasks);
  const rows = tasks.map(t => `
    <div class="detail-row">
      <span class="task-name">${t.name}</span>
      <span class="task-meta">${t.pomodoros}× · ${fmtMinutes(t.minutes)}</span>
    </div>`).join("") || `<div class="placeholder">Sin Pomodoros ese día.</div>`;

  return `<div class="layout-c">
    <div class="calendar-col"><div class="grid">${gridHtml}</div></div>
    <div class="sidebar">
      <h2>${selectedDay} de ${MONTH_NAMES[MONTH]}</h2>
      <div class="sidebar-sub">${total} Pomodoro${total !== 1 ? "s" : ""} en total</div>
      ${rows}
    </div>
  </div>`;
}

function wireCellClicks() {
  document.querySelectorAll(".cell.has-activity").forEach(cellEl => {
    cellEl.addEventListener("click", () => {
      const day = Number(cellEl.dataset.day);
      if (variant === "B") {
        const backdrop = document.getElementById("modalBackdrop");
        document.getElementById("modalContent").innerHTML = modalContentHtml(day);
        backdrop.classList.add("open");
        wireModal();
      } else {
        selectedDay = day;
        render();
      }
    });
  });
  document.getElementById("prevMonth")?.addEventListener("click", () => alert("PROTOTIPO: navegación real de mes no implementada — mockup de un solo mes."));
  document.getElementById("nextMonth")?.addEventListener("click", () => alert("PROTOTIPO: navegación real de mes no implementada — mockup de un solo mes."));
}

function setVariant(newVariant) {
  variant = newVariant;
  const url = new URL(location.href);
  url.searchParams.set("variant", variant);
  history.replaceState({}, "", url);
  render();
}
function cycleVariant(delta) {
  const idx = VARIANTS.findIndex(v => v.key === variant);
  const next = VARIANTS[(idx + delta + VARIANTS.length) % VARIANTS.length];
  setVariant(next.key);
}
document.getElementById("prevVariant").addEventListener("click", () => cycleVariant(-1));
document.getElementById("nextVariant").addEventListener("click", () => cycleVariant(1));
document.addEventListener("keydown", (e) => {
  const tag = document.activeElement?.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || document.activeElement?.isContentEditable) return;
  if (e.key === "ArrowLeft") cycleVariant(-1);
  if (e.key === "ArrowRight") cycleVariant(1);
});

render();
</script>
