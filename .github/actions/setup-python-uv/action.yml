name: Setup Python and uv
description: >-
  Install uv and sync project dependencies from the lockfile. Shared by every CI job so the
  install steps exist in exactly one place (CES-118).

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        version: "0.11.12"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked
      shell: bash
