name: setup-backend
description: Sync backend dependencies with uv (run after actions/checkout)

inputs:
  uv-version:
    description: uv version to install
    required: true

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: true

    - name: Sync dependencies
      shell: bash
      run: uv sync --locked
