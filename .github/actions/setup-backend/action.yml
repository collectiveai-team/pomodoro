name: setup-backend
description: Checkout the repo and sync backend dependencies with uv

inputs:
  uv-version:
    description: uv version to install
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@v8.3.2
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: true

    - name: Sync dependencies
      shell: bash
      run: uv sync --locked
