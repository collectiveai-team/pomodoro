name: E2E

# Playwright smoke against the docker compose stack. Independent of the deterministic unit gate
# (ci.yml): it needs Docker and a browser, so it never runs under `uv run pytest`.
# Lifecycle is backend/scripts/smoke_compose.sh: build, explicit migrate step (ADR-0002), up,
# health check, test command, and teardown via an EXIT trap even on failure.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: e2e/pnpm-lock.yaml

      - name: Install e2e dependencies
        working-directory: e2e
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke against the compose stack
        env:
          FRONTEND_PORT: "3000"
        run: backend/scripts/smoke_compose.sh pnpm --dir e2e exec playwright test
