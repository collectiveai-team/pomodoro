[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version derived from git tags (vX.Y.Z) by hatch-vcs.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["backend/pomodoro"]

# MARK: Ruff
[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "C4",
  "C90",
  "ICN",
  "INP",
  "PIE",
  "PT",
  "TC",
  "PGH",
  "NPY",
  "PLE",
  "PLW",
  "FA",
  "B",
  "S",
  "G",
  "SIM",
  "RET",
  "DTZ",
  "PTH",
  "LOG",
  "TID",
  "UP",
  "RUF",
  "ERA001",
  "D200",
  "D205",
  "D212",
  "D300",
  "D301",
  "D400",
  "D401",
  "D403",
  "D405",
  "D406",
  "D407",
  "D408",
  "D409",
  "D410",
  "D411",
  "D412",
  "D413",
  "D414",
  "D415",
  "D417",
  "D418",
  "D419",
  "PERF",
]
task-tags = ["TODO", "FIXME", "XXX", "MARK"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

# Ban relative imports (e.g. `from .module import ...`) in favor of absolute
# package imports, so modules are unambiguous and easy to move.
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "INP001", "S603", "S607", "S106", "S105"]
# FastAPI routes and Pydantic schemas are introspected at runtime (`get_type_hints`)
# to build request/response validation, so TC001/TC003 would break them by hiding
# required imports behind `TYPE_CHECKING` — these annotations are never lazy.
"backend/pomodoro/api/**" = ["TC001", "TC003"]
# SQLModel table classes are introspected at runtime the same way, to build columns.
"backend/pomodoro/database/**" = ["TC001", "TC003"]

# MARK: deptry
# The import package lives under `backend/` (ADR-0001), not at the repo root, so deptry
# can't infer it is first-party from directory layout alone.
[tool.deptry]
known_first_party = ["pomodoro"]

# psycopg is a PostgreSQL DBAPI driver selected by SQLAlchemy through the
# `postgresql+psycopg://` URL scheme, never imported directly by our code.
# tzdata is the IANA database `zoneinfo` falls back to when the host (e.g. a
# slim container image) ships no system tz files; it is never imported.
[tool.deptry.per_rule_ignores]
DEP002 = ["psycopg", "tzdata"]

# MARK: Pyrefly
[tool.pyrefly]
project-excludes = [
  "**/node_modules",
  "**/__pycache__",
  "**/venv/**/*",
  "**/.venv/**/*",
  "**/.uv_cache/**/*",
  ".worktrees/**",
  ".orquestalite/**",
]
use-ignore-files = false
disable-project-excludes-heuristics = true

# MARK: import-linter (CES-5 layer direction, CES-17 api-boundary layout)
# Enforces the house import direction: entrypoints -> api -> database -> core (a higher layer
# may import lower ones, never the reverse). Run with `uv run lint-imports`.
[tool.importlinter]
root_package = "pomodoro"

[[tool.importlinter.contracts]]
name = "Layered architecture (CES-5)"
type = "layers"
layers = [
  "pomodoro.entrypoints",
  "pomodoro.api",
  "pomodoro.database",
  "pomodoro.core",
]

# CES-17 api-boundary layout: the api package is the only inbound HTTP boundary; nothing
# outside api may import api.schemas/routers internals.
[[tool.importlinter.contracts]]
name = "API is the only inbound boundary (CES-17)"
type = "forbidden"
source_modules = ["pomodoro.core", "pomodoro.database"]
forbidden_modules = ["pomodoro.api"]

# MARK: Pytest
[tool.pytest.ini_options]
# Imports must never come from sys.path: `importlib` mode imports test modules
# without inserting their directory, so the package under test resolves from the
# installed distribution only. The default `prepend` mode mutates sys.path.
addopts = ["--import-mode=importlib"]
consider_namespace_packages = false
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "unit: fast isolated tests, no external deps",
  "integration: tests requiring external services or multi-component interaction",
  "e2e: end-to-end smoke tests",
]

[project]
name = "pomodoro"
dynamic = ["version"]
description = "Pomodoro timer"
readme = "README.md"
# CES-77 (version pin): requires-python is intentionally left as a non-enforced comment so an
# existing repo's pin wins (pairs with general-respect-local-repo, CES-30). The house baseline
# default is 3.14 — uncomment and adjust only when you deliberately set a floor:
requires-python = ">=3.14"

# MARK: Dependencies
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.9.0",
  "sqlmodel>=0.0.47",
  "alembic>=1.20.0",
  "psycopg[binary]>=3.3.6",
  "sqlalchemy>=2.0.54",
  "pwdlib[argon2]>=0.3.1",
  "email-validator>=2.3.0",
  "tzdata>=2026.5",
]

[project.scripts]
pomodoro-api = "pomodoro.entrypoints.app:main"
pomodoro-export-openapi = "pomodoro.entrypoints.export_openapi:main"

# MARK: Extra deps
[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-timeout>=2.3.1",
  # CES-111 (test-order-randomization-pytest-randomly): random, reproducibly-seeded test
  # order on every run — catches state-leaking/order-dependent tests for free.
  "pytest-randomly>=4.1.0",
  "ruff>=0.7.0",
  # TestClient (fastapi.testclient) wraps httpx; not pulled in by fastapi's base deps.
  "httpx>=0.27.0",
  "import-linter>=2.1",
]
