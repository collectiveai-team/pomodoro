[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pomodoro"]

# MARK: Ruff
# Inherits line-length, lint.select, docstring/mccabe/import settings from the root
# project's pyproject.toml (one lint stack, CES-58) instead of duplicating them here.
[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
# The inherited root config's "tests/**" entry is defined relative to *its own*
# directory, so it does not reach this project's nested tests/ — repeated here.
# S106 (possible hardcoded password): fixture hashes/tokens here are deliberate test
# literals, never real secrets.
"tests/**" = ["S101", "INP001", "S603", "S607", "S106"]
# FastAPI resolves dependencies by parameter default (`Depends(...)`), which ruff's
# flake8-bugbear otherwise flags as a mutable/call-in-default-argument hazard.
"pomodoro/api/**" = ["B008"]
# CES-74 house logger drop-in: the documented lazy-configure-once pattern needs a
# module-level flag flipped from inside `_configure()`.
"pomodoro/core/logger.py" = ["PLW0603"]
# SQLModel resolves field annotations at class-definition time (it is a pydantic model,
# not a lazily-evaluated dataclass), so `datetime` must stay a real top-level import here,
# never moved behind `TYPE_CHECKING` the way flake8-type-checking otherwise prefers.
"pomodoro/database/tables.py" = ["TC003"]

# MARK: Pyrefly
[tool.pyrefly]
project-excludes = [
  "**/node_modules",
  "**/__pycache__",
  "**/venv/**/*",
  "**/.venv/**/*",
  "**/.uv_cache/**/*",
]
use-ignore-files = false
disable-project-excludes-heuristics = true

# MARK: import-linter (CES-5 layer direction, CES-17 api-boundary layout)
[tool.importlinter]
root_package = "pomodoro"

[[tool.importlinter.contracts]]
name = "Layered architecture (CES-5)"
type = "layers"
layers = [
  "pomodoro.entrypoints",
  "pomodoro.api",
  "pomodoro.database",
  "pomodoro.core",
]
# alembic/env.py is invoked standalone by the `alembic` CLI, never imported by the
# running app, so it reuses the single CES-76 settings module (get_settings()) for
# DATABASE_URL instead of duplicating env-var parsing — see its module docstring.
ignore_imports = [
  "pomodoro.database.migrations.env -> pomodoro.entrypoints.settings",
]

# CES-17 api-boundary layout: the api package is the only inbound HTTP boundary; nothing
# outside api may import api.schemas/routers internals.
[[tool.importlinter.contracts]]
name = "API is the only inbound boundary (CES-17)"
type = "forbidden"
source_modules = ["pomodoro.core", "pomodoro.database"]
forbidden_modules = ["pomodoro.api"]

# MARK: Pytest
[tool.pytest.ini_options]
# Imports must never come from sys.path: `importlib` mode imports test modules
# without inserting their directory, so the package under test resolves from the
# installed distribution only. The default `prepend` mode mutates sys.path.
addopts = ["--import-mode=importlib"]
consider_namespace_packages = false
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "unit: fast isolated tests, no external deps",
  "integration: tests requiring external services or multi-component interaction",
  "e2e: end-to-end smoke tests",
]

[project]
name = "pomodoro-backend"
# Not published anywhere; a deployable internal service, so a static version is
# enough (unlike the root package, which uses hatch-vcs for its own build).
version = "0.1.0"
description = "Pomodoro Collective backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.14"

# MARK: Dependencies
dependencies = [
  "alembic>=1.13.0",
  "fastapi>=0.115.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  # Promoted out of the dev group (T2): `database/engine.py`, `database/tables.py` and the
  # Alembic migrations now import it directly at runtime (FK pragma event listener, Column/
  # Index/CheckConstraint construction), not just under TYPE_CHECKING.
  "sqlalchemy>=2.0.35",
  "sqlmodel>=0.0.22",
  "structlog>=24.4.0",
  # PostgreSQL DBAPI driver for `postgresql://` DATABASE_URLs in production (ADR-0002);
  # SQLAlchemy's postgresql dialect imports it directly, so it must be a real runtime
  # dependency, not a dev/test-only one. [binary] ships prebuilt wheels so prod images
  # don't need a C toolchain.
  "psycopg[binary]>=3.2.0",
  # Never imported directly; zoneinfo (used by the History day-grouping rule, T16)
  # needs it to resolve IANA zones on trimmed base images with no system tzdata.
  "tzdata>=2024.1",
]

# MARK: Extra deps
[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-timeout>=2.3.1",
  # CES-111 (test-order-randomization-pytest-randomly): random, reproducibly-seeded test
  # order on every run — catches state-leaking/order-dependent tests for free.
  "pytest-randomly>=4.1.0",
  "ruff>=0.7.0",
  "httpx>=0.27.0",
  "import-linter>=2.1",
]

# MARK: deptry (CES-109)
[tool.deptry.per_rule_ignores]
# tzdata is a runtime necessity for zoneinfo, never imported directly — deptry can only
# ever see it as declared-but-unused (DEP002). psycopg is likewise never imported by our
# code directly: SQLAlchemy's postgresql dialect imports it internally when a
# `postgresql://` URL is used (see database/engine.py), so deptry can only ever see it as
# declared-but-unused too.
DEP002 = ["tzdata", "psycopg"]
